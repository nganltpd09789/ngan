<div class="container">
    <h2>Create Todo</h2>
  
    <!-- Success message -->
    <div *ngIf="success" class="alert alert-success mt-3">
      Todo created successfully!
    </div>
  
    <!-- Error message -->
    
  
    <form [formGroup]="todoForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="title">Title</label>
        <input
          type="text"
          id="title"
          class="form-control"
          formControlName="title"
          [class.is-invalid]="todoForm.get('title')?.invalid && todoForm.get('title')?.touched"
        />
        <div *ngIf="todoForm.get('title')?.invalid && todoForm.get('title')?.touched" class="invalid-feedback">
          Title is required and must be at least 3 characters long.
        </div>
      </div>
  
      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" class="form-control" formControlName="status">
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
      </div>
  
      <button type="submit" class="btn btn-primary mt-3" [disabled]="submitting">
        {{ submitting ? 'Submitting...' : 'Create Todo' }}
      </button>
  
      <div *ngIf="submitting" class="mt-3">
        <p>Submitting...</p>
      </div>
    </form>
  </div>
