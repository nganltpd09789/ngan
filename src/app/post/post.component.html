<div class="card mb-3">
    <div class="card-header">
      <h5>{{ post().title }}</h5>
    </div>
    <div class="card-body">
      <p class="card-text">{{ post().body }}</p>
    </div>
    <div class="card-footer text-muted">
      Post ID: {{ post().id }} | User ID: {{ post().user_id }}
    </div>
  </div>
